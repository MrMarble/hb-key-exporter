name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # release-please bumps package.json and pushes the tag in one commit, so
      # these agree by construction. Kept as a guard for hand-pushed tags.
      - name: Fail if tag != package.json version
        run: |
          set -euo pipefail
          pkg_ver="$(jq -r .version package.json)"
          ref_name="${GITHUB_REF_NAME}"
          tag="${ref_name#v}"
          ver_line="$(grep -n -m1 '"version"' package.json | cut -d: -f1 || echo 1)"
          if [ "$pkg_ver" != "$tag" ]; then
            echo "::error file=package.json,line=${ver_line}::Tag ${ref_name} (version ${tag}) != package.json version ${pkg_ver}. Re-tag the correct commit (or bump version)."
            exit 1
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      # release-please creates the release as a draft (draft: true) and pushes
      # the tag itself (force-tag-creation), which is what triggers this run.
      # Uploading to a *published* release is rejected once the repo has
      # immutable releases enabled, so the asset has to go on while it is still
      # a draft. Omitting `draft` here makes this action publish the draft after
      # the upload succeeds -- so the release only goes live with its asset
      # attached, and a failed build leaves a draft rather than an empty release.
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: dist/hb-key-exporter.user.js
